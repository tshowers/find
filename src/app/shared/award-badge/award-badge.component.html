<div class="award-badge"
     [class.award-badge--unlocked]="state === 'unlocked'"
     [class.award-badge--locked]="state === 'locked'"
     [class.award-badge--mystery]="state === 'mystery'"
     [style.width.px]="size" [style.height.px]="size" [style.border-radius.px]="radius">

  <div class="award-badge__sheen" *ngIf="state === 'unlocked'"></div>

  <svg class="award-badge__glow" [class.award-badge__glow--on]="state === 'unlocked'"
       [attr.width]="svgSize" [attr.height]="svgSize" viewBox="0 0 46 46">
    <ng-container [ngSwitch]="state">
      <ng-container *ngSwitchCase="'unlocked'">
        <circle cx="23" cy="23" r="17.5" fill="none" stroke="#7fb3d8" stroke-width="1.6" stroke-dasharray="24 7 46 7" stroke-linecap="round"/>
        <circle cx="23" cy="4.3" r="2" fill="#0d1620" stroke="#a9e0ff" stroke-width="1.3"/>
        <circle cx="4.3" cy="23" r="2" fill="#0d1620" stroke="#a9e0ff" stroke-width="1.3"/>
        <circle cx="35.5" cy="35.5" r="2.4" fill="#8fd4ff"/>
      </ng-container>
      <ng-container *ngSwitchCase="'locked'">
        <circle cx="23" cy="23" r="17.5" fill="none" stroke="#4a5560" stroke-width="1.5" stroke-dasharray="24 7 46 7" stroke-linecap="round" opacity="0.85"/>
        <circle cx="23" cy="4.3" r="2" fill="#171c22" stroke="#4a5560" stroke-width="1.2"/>
        <circle cx="4.3" cy="23" r="2" fill="#171c22" stroke="#4a5560" stroke-width="1.2"/>
        <circle cx="35.5" cy="35.5" r="2.2" fill="#3a4450"/>
      </ng-container>
      <ng-container *ngSwitchCase="'mystery'">
        <circle cx="23" cy="23" r="17.5" fill="none" stroke="#2c343c" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.7"/>
      </ng-container>
    </ng-container>

    <g *ngIf="state !== 'mystery'" [attr.stroke]="state === 'unlocked' ? '#a9e0ff' : '#525f6a'" [attr.stroke-width]="state === 'unlocked' ? 1.8 : 1.7"
       fill="none" stroke-linecap="round" stroke-linejoin="round" [attr.opacity]="state === 'unlocked' ? 1 : 0.9" [ngSwitch]="icon">

      <ng-container *ngSwitchCase="'rebel'">
        <circle cx="20" cy="20" r="7"></circle>
        <line x1="25" y1="25" x2="31" y2="31"></line>
      </ng-container>

      <ng-container *ngSwitchCase="'curious'">
        <circle cx="23" cy="19" r="7"></circle>
        <line x1="19.5" y1="19" x2="26.5" y2="19"></line>
        <rect x="20" y="26" width="6" height="3.4" rx="1.2"></rect>
        <line x1="23" y1="8" x2="23" y2="11.5"></line>
        <line x1="13.5" y1="13" x2="16" y2="15.2"></line>
        <line x1="32.5" y1="13" x2="30" y2="15.2"></line>
      </ng-container>

      <ng-container *ngSwitchCase="'night-owl'">
        <path d="M27 12.5 A10 10 0 1 0 27 33.5 A7.5 7.5 0 1 1 27 12.5 Z"></path>
        <circle cx="31.5" cy="14" r="1.3" [attr.fill]="state === 'unlocked' ? '#a9e0ff' : '#525f6a'" stroke="none"/>
      </ng-container>

      <ng-container *ngSwitchCase="'early-bird'">
        <circle cx="23" cy="26" r="6.5"></circle>
        <line x1="23" y1="11" x2="23" y2="15"></line>
        <line x1="15" y1="15" x2="17.6" y2="17.6"></line>
        <line x1="31" y1="15" x2="28.4" y2="17.6"></line>
        <line x1="13" y1="32" x2="33" y2="32"></line>
      </ng-container>

      <ng-container *ngSwitchCase="'connector'">
        <line x1="17" y1="17" x2="31" y2="17"></line>
        <line x1="17" y1="17" x2="23" y2="31"></line>
        <line x1="31" y1="17" x2="23" y2="31"></line>
        <circle cx="17" cy="17" r="2.4"></circle>
        <circle cx="31" cy="17" r="2.4"></circle>
        <circle cx="23" cy="31" r="2.4"></circle>
      </ng-container>

      <ng-container *ngSwitchCase="'sharp-eye'">
        <path d="M12 23 C16 16 30 16 34 23 C30 30 16 30 12 23 Z"></path>
        <circle cx="23" cy="23" r="3" [attr.fill]="state === 'unlocked' ? '#a9e0ff' : '#525f6a'" stroke="none"></circle>
      </ng-container>

      <ng-container *ngSwitchCase="'explorer'">
        <polygon points="23,13 27,23 23,33 19,23"></polygon>
        <circle cx="23" cy="23" r="1.6" [attr.fill]="state === 'unlocked' ? '#a9e0ff' : '#525f6a'" stroke="none"></circle>
      </ng-container>

      <ng-container *ngSwitchCase="'specialist'">
        <polygon points="15,18 23,11 31,18 26,31 20,31"></polygon>
        <line x1="15" y1="18" x2="31" y2="18"></line>
        <line x1="23" y1="11" x2="20" y2="31"></line>
        <line x1="23" y1="11" x2="26" y2="31"></line>
      </ng-container>

      <ng-container *ngSwitchCase="'relentless'">
        <polygon points="25,10 15,25 21,25 18,34 30,18 23,18"></polygon>
      </ng-container>

      <ng-container *ngSwitchCase="'tastemaker'">
        <polygon points="23,10 25.9,17.2 33.5,17.5 27.4,22.3 29.6,29.6 23,25.3 16.4,29.6 18.6,22.3 12.5,17.5 20.1,17.2"></polygon>
      </ng-container>

    </g>
  </svg>

  <div class="award-badge__mystery-mark" *ngIf="state === 'mystery'" [style.font-size.px]="mysteryFontSize">?</div>
</div>
