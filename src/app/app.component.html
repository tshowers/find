<div class="find-install-banner" *ngIf="showInstallBanner" role="region" aria-label="Install Find">
  <div class="find-install-banner__copy">
    <strong>Find is better on iPhone</strong>
    <span>Take the fastest answer with you.</span>
  </div>
  <a class="find-install-banner__cta" [href]="appStoreUrl" target="_blank" rel="noopener noreferrer">Get the app <span aria-hidden="true">↗</span></a>
  <button type="button" class="find-install-banner__close" (click)="dismissInstallBanner()" aria-label="Dismiss app install suggestion">×</button>
</div>
<div class="app-global-actions"><app-platform-menu /></div>
<app-command-palette />
<router-outlet></router-outlet>
